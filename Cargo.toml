# SPDX-License-Identifier: GPL-2.0-or-later

[workspace]
members = ["crates/profile-data", "crates/profile-helper"]
resolver = "3"

[package]
name = "xfce4-profile-editor"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "GPL-2.0-or-later"
description = "A system profile editor for Xfce"
repository = "https://github.com/camelofcode/xfce4-profile-editor"

[features]
default = ["camera"]
camera = ["dep:nokhwa", "dep:v4l"]

[dependencies]
gettext-rs = { version = "0.8.0", features = ["gettext-system"] }
gtk = { package = "gtk4", version = "0.11.5", features = ["v4_10", "xml_validation"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
nokhwa = { version = "0.10.11", default-features = false, features = ["input-v4l"], optional = true }
rustix = { version = "1.1.6", features = ["process"] }
serde_json = "1.0.145"
thiserror = "2.0.21"
v4l = { version = "0.14.0", default-features = false, features = ["v4l2"], optional = true }
xfce4-profile-data = { path = "crates/profile-data" }
xfce4-profile-editor-helper = { path = "crates/profile-helper" }
zbus = { version = "6.2.1", default-features = false, features = ["default-rt", "proxy"] }

[build-dependencies]
glib-build-tools = "0.22.8"
